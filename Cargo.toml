[package]
name = "monster-control-center"
version = "0.2.0"
edition = "2024"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = "2"

[[bin]]
name = "monster-control-center"
path = "src/main.rs"

[[bin]]
name = "monster-control-center-gui"
path = "src/gui.rs"

[package]
name = "monster-control-center"
version = "1.0.1"
edition = "2024"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evdev = "0.13"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "monster-control-center-gui"
path = "src/gui.rs"

[[bin]]
name = "monster-control-center"
path = "src/main.rs"

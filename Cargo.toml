[package]
name = "txectrl"
version = "1.1.2"
edition = "2024"

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
evdev = "0.13"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[[bin]]
name = "txectrl-gui"
path = "src/gui.rs"

[[bin]]
name = "txectrl"
path = "src/main.rs"

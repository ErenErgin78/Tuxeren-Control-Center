name: Release & Build Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages (deb, appimage, rpm)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libasound2-dev \
            libpulse-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            squashfs-tools \
            libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build and Package with Tauri CLI
        env:
          NO_STRIP: "true"
        run: |
          bash scripts/build_packages.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monster-control-center-linux-packages
          path: dist/*

  build-windows:
    name: Build Windows Packages (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build Standalone Executable & NSIS Bundle
        shell: bash
        run: |
          mkdir -p dist
          cargo build --release
          cp target/release/monster-control-center-gui.exe dist/
          npx --yes @tauri-apps/cli build --bundles nsis || true
          if [ -d "target/release/bundle/nsis" ]; then
            cp target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
          fi
          ls -la dist/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monster-control-center-windows-packages
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Inspect release packages
        run: |
          mkdir -p dist
          cp release-artifacts/* dist/ 2>/dev/null || true
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event.inputs.release_draft || false }}
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.rpm
            dist/*.deb
            dist/*.AppImage
            dist/*.exe

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="solidDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </radialGradient>
    <style>
      .bg-dark { fill: url(#solidDark); }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animated-fan-array {
        transform-origin: 256px 256px;
        animation: spin 4.8s linear infinite;
      }
    </style>
    <path d="M216.5 150.8C210 85 270 42 344 48c12 1 14 10 3 18-47 36-55 69-41 104.5Z" id="bladeGeometry"/>
    <g id="fanBlade">
      <use href="#bladeGeometry" class="bg-dark"/>
      <use href="#bladeGeometry" style="stroke:#10b981;stroke-opacity:.25;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none"/>
      <use href="#bladeGeometry" style="stroke:#10b981;stroke-opacity:.6;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;fill:none"/>
      <use href="#bladeGeometry" style="stroke:#34d399;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none"/>
    </g>
  </defs>

  <!-- Rotating Fan Array -->
  <g class="animated-fan-array">
    <use href="#fanBlade"/>
    <use href="#fanBlade" transform="rotate(60 256 256)"/>
    <use href="#fanBlade" transform="rotate(120 256 256)"/>
    <use href="#fanBlade" transform="rotate(180 256 256)"/>
    <use href="#fanBlade" transform="rotate(240 256 256)"/>
    <use href="#fanBlade" transform="rotate(300 256 256)"/>
  </g>

  <!-- Static Center Ring & Hub -->
  <circle cx="256" cy="256" r="114" class="bg-dark" stroke="#23262d" stroke-width="4"/>
  <circle cx="256" cy="256" r="102" stroke="#10b981" stroke-width="5" stroke-opacity=".25" fill="none"/>
  <circle cx="256" cy="256" r="102" stroke="#10b981" stroke-width="2" fill="none"/>

  <!-- Static Center Typography / Monogram -->
  <g id="typography">
    <path d="M194 194h124v28h-48v96h-28v-96h-48Z" style="fill:#fff"/>
    <path d="M226 254h-32v12h20v14h-16v12h16v14h-20v12h32Zm60 0h32v12h-20v14h16v12h-16v14h20v12h-32Z" style="fill:#10b981"/>
  </g>
</svg>
